# ============================================================
# Nginx 反向代理配置（可选，生产环境推荐）
#
# 用法：
#   sudo cp nginx-rsshub.conf /etc/nginx/conf.d/rsshub.conf
#   # 修改 server_name 与 SSL 证书路径
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# HTTP -> HTTPS 跳转
server {
    listen 80;
    server_name rss.example.com;   # ← 改成你的域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rss.example.com;   # ← 改成你的域名

    # SSL 证书（用 certbot 申请：certbot --nginx -d rss.example.com）
    ssl_certificate     /etc/letsencrypt/live/rss.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rss.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 透传真实协议，避免 RSSHub 生成 http 链接
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 长轮询/慢路由需要较长超时（部分路由要抓取多个页面）
    proxy_connect_timeout 60s;
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;

    # 压缩
    gzip on;
    gzip_types application/rss+xml application/atom+xml application/xml text/xml;

    location / {
        proxy_pass http://127.0.0.1:1200;   # ← 与 .env 的 PORT 保持一致
    }

    # 健康检查
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:1200/;
    }
}
